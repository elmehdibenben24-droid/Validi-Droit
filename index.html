<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validi Droit - المحاكي الشامل لامتحانات الحقوق S1</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #2563eb;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --success: #059669;
            --error: #dc2626;
            --light-success: #d1fae5;
            --light-error: #fee2e2;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 15px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        .app-container { background: var(--card); width: 100%; max-width: 850px; border-radius: 16px; box-shadow: 0 10px 35px rgba(0,0,0,0.1); padding: 30px; position: relative; overflow: hidden; }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        .header h1 { color: var(--primary); margin: 0; font-size: 26px; font-weight: 900; }
        .header p { color: #64748b; margin: 8px 0 0 0; font-size: 15px; font-weight: 600; }
        
        /* شاشة اختيار المادة */
        #subject-selection { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 15px; }
        .subject-btn { background: #f8fafc; border: 2px solid #cbd5e1; padding: 18px; border-radius: 12px; font-size: 17px; font-weight: 700; color: var(--primary); cursor: pointer; transition: 0.2s; display: flex; flex-direction: column; align-items: center; gap: 8px; }
        .subject-btn span.badge { background: #e0f2fe; color: #0369a1; font-size: 13px; padding: 4px 10px; border-radius: 20px; }
        .subject-btn:hover { border-color: var(--secondary); background: #eff6ff; transform: translateY(-3px); box-shadow: 0 4px 12px rgba(37,99,235,0.1); }
        .all-btn { grid-column: 1 / -1; background: var(--primary); color: white; border: none; padding: 20px; font-size: 19px; }
        .all-btn span.badge { background: rgba(255,255,255,0.2); color: white; }
        .all-btn:hover { background: var(--secondary); }

        /* شاشة الامتحان */
        #quiz-screen { display: none; }
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .back-home { background: #e2e8f0; border: none; padding: 8px 14px; border-radius: 8px; font-weight: bold; cursor: pointer; color: #334155; font-size: 14px; }
        .back-home:hover { background: #cbd5e1; }
        .progress-bar { width: 100%; background: #e2e8f0; border-radius: 10px; height: 12px; margin-bottom: 20px; overflow: hidden;}
        .progress-fill { background: var(--secondary); height: 100%; width: 0%; transition: 0.3s ease; }
        .stats { display: flex; justify-content: space-between; font-size: 15px; color: #475569; margin-bottom: 20px; font-weight: bold; background: #f1f5f9; padding: 12px 15px; border-radius: 10px; }
        #question-text { font-size: 20px; line-height: 1.6; margin-bottom: 25px; color: #1e293b; font-weight: 800; }
        
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: white; border: 2px solid #cbd5e1; padding: 16px 20px; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; text-align: right; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; color: #1e293b; line-height: 1.4; }
        .option-btn:hover:not(:disabled) { border-color: var(--secondary); background: #f8fafc; }
        .option-btn:disabled { cursor: default; }
        
        /* التغذية الراجعة (التصحيح المباشر) */
        .option-btn.correct { background: var(--light-success) !important; border-color: var(--success) !important; color: #065f46 !important; font-weight: 800; }
        .option-btn.wrong { background: var(--light-error) !important; border-color: var(--error) !important; color: #991b1b !important; }
        .icon { font-size: 20px; margin-right: 10px; flex-shrink: 0; }

        #next-btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 25px; transition: 0.2s; display: none; }
        #next-btn:hover { background: var(--secondary); }
        
        /* شاشة النتيجة */
        #result-screen { display: none; text-align: center; }
        .score-circle { width: 160px; height: 160px; border-radius: 50%; border: 10px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 38px; font-weight: 900; color: var(--primary); margin: 0 auto 25px; }
        .btn-restart { background: var(--primary); color: white; border: none; padding: 16px 35px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-restart:hover { background: var(--secondary); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Validi Droit - محاكي امتحانات القـانون (S1)</h1>
        <p>بنك أسئلة مكثف وشامل مع التصحيح الفوري الذكي</p>
    </div>

    <!-- شاشة اختيار المادة -->
    <div id="subject-selection">
        <button class="subject-btn" onclick="startQuiz('law')">
            <span>المدخل لدراسة القانون والوضعي</span>
            <span class="badge" id="count-law">25 سؤال</span>
        </button>
        <button class="subject-btn" onclick="startQuiz('sharia')">
            <span>مدخل لدراسة الشريعة الإسلامية</span>
            <span class="badge" id="count-sharia">20 سؤال</span>
        </button>
        <button class="subject-btn" onclick="startQuiz('international')">
            <span>العلاقات الدولية</span>
            <span class="badge" id="count-international">20 سؤال</span>
        </button>
        <button class="subject-btn" onclick="startQuiz('economics')">
            <span>العلوم الاقتصادية والتدبير</span>
            <span class="badge" id="count-economics">20 سؤال</span>
        </button>
        <button class="subject-btn" onclick="startQuiz('politics')">
            <span>مدخل إلى علم السياسة</span>
            <span class="badge" id="count-politics">15 سؤال</span>
        </button>
        <button class="subject-btn" onclick="startQuiz('terminologie')">
            <span>المصطلحات القانونية (Français/Arabe)</span>
            <span class="badge" id="count-terminologie">10 أسئلة</span>
        </button>
        <button class="subject-btn all-btn" onclick="startQuiz('all')">
            <span>🔥 الامتحان الشامل (جميع وحدات السداسية الأولى)</span>
            <span class="badge" id="count-all">110 سؤال</span>
        </button>
    </div>

    <!-- شاشة الامتحان -->
    <div id="quiz-screen">
        <div class="top-bar">
            <button class="back-home" onclick="goHome()">🏠 القائمة الرئيسية</button>
            <span id="subject-title" style="font-weight: bold; color: var(--primary);"></span>
        </div>
        <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
        <div class="stats">
            <span id="question-counter">السؤال 1</span>
            <span id="score-counter" style="color: var(--success);">الإجابات الصحيحة: 0</span>
        </div>
        <h2 id="question-text">جاري التحميل...</h2>
        <div class="options-grid" id="options-grid"></div>
        <button id="next-btn" onclick="loadNextQuestion()">السؤال الموالي ⬅️</button>
    </div>

    <!-- شاشة النتيجة -->
    <div id="result-screen">
        <h2 style="color: var(--primary); font-size: 28px;">انتهى الاختبار!</h2>
        <div class="score-circle" id="final-score">0%</div>
        <p id="feedback-msg" style="font-size: 19px; color: #334155; margin-bottom: 30px; line-height: 1.6;"></p>
        <button class="btn-restart" onclick="goHome()">العودة لاختيار وحدة أخرى 🏠</button>
    </div>
</div>

<script>
    const allQuestions = [
        // ================= 1. المدخل للعلوم القانونية والقانون الوضعي (25 سؤال) =================
        { subject: 'law', question: "أصل كلمة 'قانون' يعود إلى الكلمة اليونانية (Kanun) والتي تعني لغوياً:", options: ["السلطة القهرية", "العصا المستقيمة (الخط المستقيم كمعيار لقياس الانحراف)", "الحكم القضائي المكتوب", "العرف الاجتماعي القديم"], answer: 1 },
        { subject: 'law', question: "ما هو التعريف الدقيق للقانون بمعناه الضيق (الخاص)؟", options: ["كل قاعدة ثابتة تفيد استمرار أمر معين في الطبيعة", "مجموعة القواعد المكتوبة الصادرة عن السلطة التشريعية المختصة (البرلمان)", "جميع القواعد العرفية والدينية غير المكتوبة", "الأحكام الصادرة عن القضاة في المحاكم الابتدائية"], answer: 1 },
        { subject: 'law', question: "عرف الفقيه (دابان) الحق بأنه:", options: ["مجرد مصلحة مادية أو أدبية يحميها القانون", "استئثار شخص بقيمة معينة أو شيء معين عن طريق التسلط على تلك القيمة أو الشيء", "قدرة إرادية مطلقة غير مقيدة بأي قانون", "هبة تمنحها السلطة التنفيذية للمواطنين"], answer: 1 },
        { subject: 'law', question: "القاعدة القانونية هي 'قاعدة تقويمية سلوكية'، مما يعني أنها:", options: ["تحاسب الإنسان على نواياه وأفكاره الداخلية المحضة", "لا تنظم إلا السلوك الخارجي للإنسان ولا تعتد بالنوايا إلا إذا اقترنت بفعل خارجي", "تفرض على الإنسان حب الخير للجميع في ضميره", "تعاقب على مجرد التفكير في ارتكاب الجريمة"], answer: 1 },
        { subject: 'law', question: "ماذا يُقصد بأن القاعدة القانونية 'تبدأ مجردة لتنتهي عند التطبيق عامة'؟", options: ["أنها تصاغ دون توجيه لشخص بذاته (تجريد)، وتنطبق على كل من تتوفر فيه شروطها (عمومية)", "أنها تطبق على جميع المواطنين بدون أي استثناء فئوي", "أنها لا تطبق أبداً إذا كانت تخاطب شخصاً واحداً بصفته كرئيس الدولة", "أنها قواعد غير ملزمة عند صياغتها"], answer: 0 },
        { subject: 'law', question: "القانون الذي ينظم مهنة المفوضين القضائيين أو خطة العدالة يعتبر قاعدة عامة ومجردة لأنه:", options: ["يخاطب أشخاصاً معينين بأسمائهم العائلية", "يخاطب فئة محددة بصفاتهم لا بذواتهم، وينطبق على كل من يكتسب هذه الصفة", "يطبق على جميع المواطنين المغاربة والأجانب", "لا يتضمن أي جزاء في حالة مخالفته"], answer: 1 },
        { subject: 'law', question: "الجزاء في القاعدة القانونية يتميز بكونه:", options: ["جزاء معنوي يتمثل في تأنيب الضمير وسخط الجماعة", "جزاء مؤجل إلى الآخرة فقط", "جزاء مادي، حالّ (دنيوي)، ومنظم توقعه السلطة العامة باسم المجتمع", "اقتصاص فردي يوقعه المتضرر بنفسه في جميع الأحوال"], answer: 2 },
        { subject: 'law', question: "حسب التقسيم الجنائي للجرائم، ما هي عقوبة 'الجنح' (Délits)؟", options: ["الإعدام أو السجن المؤبد أو السجن من 5 إلى 30 سنة", "الحبس من شهر إلى 5 سنوات أو الغرامة أو هما معاً", "الاعتقال لمدة لا تتجاوز شهراً واحداً وغرامة خفيفة", "بطلان العقد والتعويض المدني فقط"], answer: 1 },
        { subject: 'law', question: "ما هو الفرق بين العقد الباطل والعقد القابل للإبطال كجزاء مدني؟", options: ["لا فرق بينهما، كلاهما ينتج آثاره القانونية كاملة", "العقد الباطل ينعدم فيه ركن أساسي فيعتبر كأن لم يكن، أما القابل للإبطال فينشأ ناقصاً (كعقد القاصر) ويبقى صحيحاً ما لم يُطلب إبطاله", "العقد الباطل يصححه القاضي تلقائياً، والقابل للإبطال لا يصحح", "القابل للإبطال يتعلق بالجرائم الجنائية فقط"], answer: 1 },
        { subject: 'law', question: "وفق مدونة الأسرة المغربية، متى تسقط نفقة الأبناء الذكور غير المعاقين؟", options: ["ببلوغ سن 15 سنة في جميع الأحوال", "ببلوغ سن 18 سنة، أو 25 سنة بالنسبة لمن يتابعون دراستهم", "بمجرد حصولهم على شهادة البكالوريا", "لا تسقط أبداً حتى يتزوجوا"], answer: 1 },
        { subject: 'law', question: "كيف نميز بين القواعد الآمرة والقواعد المكملة من خلال 'المعيار الموضوعي'؟", options: ["بالبحث عن ألفاظ النص مثل 'لا يجوز' أو 'يقع باطلاً'", "بالنظر إلى مدى اتصال مضمون القاعدة بالنظام العام والآداب العامة ومصالح المجتمع الأساسية", "بعدد الفصول القانونية في المدونة", "بتاريخ نشر القانون في الجريدة الرسمية"], answer: 1 },
        { subject: 'law', question: "ما هي طبيعة القواعد القانونية المكملة (المفسرة) من حيث الإلزام؟", options: ["هي مجرد نصائح أخلاقية غير ملزمة بتاتاً", "هي قواعد قانونية ملزمة، لكن إعمالها مشروط بعدم وجود اتفاق بين الأطراف على مخالفتها", "هي قواعد تطبق في القانون الجنائي والدستوري فقط", "هي قواعد لا تفرضها الدولة بالقوة حتى لو لم يتفق الأطراف على خلافها"], answer: 1 },
        { subject: 'law', question: "من هو الفيلسوف رائد 'المذهب التاريخي' في تفسير أساس القانون والذي قال إن القانون وليد المجتمع والتاريخ؟", options: ["الفقيه النمساوي هانز كيلسن", "الفقيه الألماني سافيني (Savigny)", "الفيلسوف الإنجليزي أوستن", "الفقيه الفرنسي ليون ديجي"], answer: 1 },
        { subject: 'law', question: "أسس الفقيه الفرنسي 'فرانسوا جيني' (Gény) مذهباً شهيراً في أساس القانون وتفسيره، ما اسمه؟", options: ["مذهب الشرح على المتون", "مذهب التضامن الاجتماعي", "مذهب العلم والصياغة (البحث العلمي الحر)", "المذهب الشكلي الاستبدادي"], answer: 2 },
        { subject: 'law', question: "ما هو المعيار الأساسي للتمييز بين القانون العام والقانون الخاص؟", options: ["القانون العام مجاني والقانون الخاص مؤدى عنه", "طبيعة الأطراف: القانون العام ينظم العلاقات التي تكون الدولة طرفاً فيها باعتبارها صاحبة سيادة وسلطان، والخاص ينظم علاقات الأفراد أو الدولة كشخص عادي", "القانون العام غير مكتوب والقانون الخاص مكتوب", "القانون العام يطبق على الأجانب فقط"], answer: 1 },
        { subject: 'law', question: "يُطلق على 'القانون المدني' في فروع القانون الخاص لقب:", options: ["القانون التبعي", "الشريعة العامة (الأصل الذي يُرجع إليه عند غياب نص خاص في الفروع الأخرى)", "قانون المسطرة الشكلية", "القانون الإداري الفرعي"], answer: 1 },
        { subject: 'law', question: "تعتبر مرحلة 'النشر في الجريدة الرسمية' ضرورية لنفاذ التشريع، وتؤسس لفرضية:", options: ["العلم الحقيقي الفعلي لكل فرد بتفاصيل القانون", "العلم المفترض بالقانون، ومنه قاعدة 'لا يعذر أحد بجهله للقانون'", "اختيارية تطبيق القانون لمن لم يقرأ الجريدة", "إلغاء الدستور السابق تلقائياً"], answer: 1 },
        { subject: 'law', question: "بماذا تتميز 'العادة الاتفاقية' عن 'العرف القانوني'؟", options: ["العادة الاتفاقية تتوفر على الركن المادي والركن المعنوي معاً", "العادة تتوفر على الركن المادي (الاعتياد) فقط وتفتقر للركن المعنوي (الشعور بالإلزام)، فلا تطبق إلا إذا اتفق الأفراد على الأخذ بها", "العادة الاتفاقية أقوى من التشريع الآمر", "العادة الاتفاقية يطبق بشأنها مبدأ لا عذر بجهل القانون"], answer: 1 },
        { subject: 'law', question: "يعد صاحب الحق 'متعسفاً في استعمال حقه' في إحدى الحالات التالية:", options: ["إذا استعمل حقه المشروع لتحقيق منفعة كبيرة دون قصد الإضرار بأحد", "إذا لم يقصد سوى الإضرار بالغير، أو كانت المصلحة قليلة الأهمية لا تتناسب البتة مع الضرر الجسيم الذي يصيب الغير", "إذا طالب بدينه المستحق عبر المحكمة المختصة", "إذا بنى في أرضه وفق رخصة قانونية دون حجب النور عمداً عن جاره"], answer: 1 },
        { subject: 'law', question: "ما الفرق بين الحق العيني (Droit réel) والحق الشخصي (Droit personnel)؟", options: ["الحق العيني سلطة مباشرة لشخص على شيء مادي دون وسيط (كالملكية)، والحق الشخصي رابطة بين دائن ومدين", "الحق العيني لا يورث بينما الحق الشخصي يورث", "الحق الشخصي يمنح صاحبه ميزتي التتبع والأولوية دون الحق العيني", "لا يوجد فرق بينهما في القانون المدني"], answer: 0 },
        { subject: 'law', question: "يخول الحق العيني لصاحبه امتيازين أساسيين لا يمنحهما الحق الشخصي العادي، وهما:", options: ["حق الحبس الجنائي وحق المصادرة", "حق التتبع (ملاحقة الشيء في أي يد) وحق الأولوية أو الرجحان (التقدم على سائر الدائنين)", "حق تغيير الاسم وحق الجنسية", "حق التقادم المسقط وحق الإلغاء"], answer: 1 },
        { subject: 'law', question: "متى تبدأ الشخصية القانونية للإنسان الطبيعي؟", options: ["منذ لحظة التلقيح وتكون الجنين بشكل مطلق", "بتمام ولادته حياً (انفصاله عن أمه مع تحقق مظاهر الحياة كالبكاء أو التنفس)", "بمجرد تسجيله في دفتر الحالة المدنية بعد شهر من ولادته", "عند بلوغه سن التمييز (7 سنوات)"], answer: 1 },

    let currentQuestions = [];

    // عناصر الواجهة
    const subjectScreen = document.getElementById('subject-selection');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionText = document.getElementById('question-text');
    const optionsGrid = document.getElementById('options-grid');
    const nextBtn = document.getElementById('next-btn');
    const progressFill = document.getElementById('progress-fill');
    const questionCounter = document.getElementById('question-counter');
    const scoreCounter = document.getElementById('score-counter');
    const subjectTitle = document.getElementById('subject-title');

    // تحديث عدد الأسئلة تلقائيا في الأزرار
    function updateBadges() {
        const subjects = ['law', 'sharia', 'international', 'economics', 'politics', 'terminologie'];
        subjects.forEach(sub => {
            const count = allQuestions.filter(q => q.subject === sub).length;
            const badge = document.getElementById(`count-${sub}`);
            if (badge) badge.innerText = `${count} سؤال`;
        });
        document.getElementById('count-all').innerText = `${allQuestions.length} سؤال`;
    }
    updateBadges();

    // خلط عشوائي
    function shuffleArray(array) {
        let arr = [...array];
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    const titlesMap = {
        'law': 'المدخل لدراسة القانون والوضعي',
        'sharia': 'الشريعة الإسلامية',
        'international': 'العلاقات الدولية',
        'economics': 'العلوم الاقتصادية والتدبير',
        'politics': 'علم السياسة',
        'terminologie': 'المصطلحات القانونية',
        'all': 'الامتحان الشامل (جميع الوحدات)'
    };

    function startQuiz(subject) {
        if (subject === 'all') {
            currentQuestions = shuffleArray(allQuestions);
        } else {
            currentQuestions = shuffleArray(allQuestions.filter(q => q.subject === subject));
        }
        
        currentQuestionIndex = 0;
        score = 0;
        subjectTitle.innerText = titlesMap[subject] || '';
        
        subjectScreen.style.display = 'none';
        resultScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        
        loadQuestion();
    }

    function goHome() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'none';
        subjectScreen.style.display = 'grid';
    }

    function loadQuestion() {
        nextBtn.style.display = 'none';
        optionsGrid.innerHTML = '';
        
        const currentQ = currentQuestions[currentQuestionIndex];
        questionText.innerText = currentQ.question;
        
        questionCounter.innerText = `السؤال ${currentQuestionIndex + 1} من ${currentQuestions.length}`;
        scoreCounter.innerText = `الإجابات الصحيحة: ${score}`;
        const progress = ((currentQuestionIndex) / currentQuestions.length) * 100;
        progressFill.style.width = `${progress}%`;

        let optionsWithIndex = currentQ.options.map((opt, index) => ({ text: opt, originalIndex: index }));
        optionsWithIndex = shuffleArray(optionsWithIndex);

        optionsWithIndex.forEach((optObj) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span>${optObj.text}</span> <span class="icon"></span>`;
            
            btn.onclick = () => checkAnswer(btn, optObj.originalIndex, currentQ.answer, optionsWithIndex);
            optionsGrid.appendChild(btn);
        });
    }

    function checkAnswer(clickedBtn, selectedOriginalIndex, correctOriginalIndex, currentOptionsData) {
        const allBtns = optionsGrid.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.disabled = true);

        if (selectedOriginalIndex === correctOriginalIndex) {
            clickedBtn.classList.add('correct');
            clickedBtn.querySelector('.icon').innerText = '✔️';
            score++;
            scoreCounter.innerText = `الإجابات الصحيحة: ${score}`;
        } else {
            clickedBtn.classList.add('wrong');
            clickedBtn.querySelector('.icon').innerText = '❌';
            
            allBtns.forEach((btn, idx) => {
                if (currentOptionsData[idx].originalIndex === correctOriginalIndex) {
                    btn.classList.add('correct');
                    btn.querySelector('.icon').innerText = '✔️';
                }
            });
        }
        
        nextBtn.style.display = 'block';
        if(currentQuestionIndex === currentQuestions.length - 1) {
            nextBtn.innerText = "عرض النتيجة النهائية 🏆";
        } else {
            nextBtn.innerText = "السؤال الموالي ⬅️";
        }
    }

    function loadNextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';
        
        const percentage = Math.round((score / currentQuestions.length) * 100);
        const scoreCircle = document.getElementById('final-score');
        const feedbackMsg = document.getElementById('feedback-msg');
        
        scoreCircle.innerText = `${percentage}%`;
        
        if(percentage >= 80) {
            scoreCircle.style.borderColor = "var(--success)";
            scoreCircle.style.color = "var(--success)";
            feedbackMsg.innerHTML = `<strong>تبارك الله عليك! فاليديتي بامتياز (Mention)!</strong><br> أجبت بشكل صحيح على ${score} من أصل ${currentQuestions.length} سؤال.`;
        } else if(percentage >= 50) {
            scoreCircle.style.borderColor = "#eab308";
            scoreCircle.style.color = "#eab308";
            feedbackMsg.innerHTML = `<strong>فاليديتي (Validé)!</strong><br> أجبت بشكل صحيح على ${score} من أصل ${currentQuestions.length} سؤال. عاود دوز الاختبار باش تجيب ميزة حسن.`;
        } else {
            scoreCircle.style.borderColor = "var(--error)";
            scoreCircle.style.color = "var(--error)";
            feedbackMsg.innerHTML = `<strong>رد بالك من Rattrapage!</strong><br> أجبت بشكل صحيح على ${score} من أصل ${currentQuestions.length} سؤال فقط. عاود الاختبار وركز على الأجوبة الخضراء.`;
        }
    }
</script>
