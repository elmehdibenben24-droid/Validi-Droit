<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة امتحانات كلية الحقوق - QCM التفاعلية</title>
    <style>
        :root {
            --primary: #1e3a8a;
            --secondary: #3b82f6;
            --bg: #f8fafc;
            --card: #ffffff;
            --text: #0f172a;
            --success: #059669;
            --error: #dc2626;
            --light-success: #d1fae5;
            --light-error: #fee2e2;
        }
        * { box-sizing: border-box; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: var(--bg); color: var(--text); margin: 0; padding: 20px; display: flex; justify-content: center; min-height: 100vh; align-items: center; }
        .app-container { background: var(--card); width: 100%; max-width: 800px; border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); padding: 30px; position: relative; overflow: hidden; }
        .header { text-align: center; margin-bottom: 25px; border-bottom: 2px solid #e2e8f0; padding-bottom: 15px; }
        .header h1 { color: var(--primary); margin: 0; font-size: 26px; font-weight: 800; }
        
        /* شاشة اختيار المادة */
        #subject-selection { display: flex; flex-direction: column; gap: 12px; }
        .subject-btn { background: #f1f5f9; border: 2px solid #cbd5e1; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: 700; color: var(--primary); cursor: pointer; transition: 0.2s; text-align: center; }
        .subject-btn:hover { border-color: var(--secondary); background: #e0f2fe; transform: scale(1.01); }
        .all-btn { background: var(--primary); color: white; border: none; margin-top: 10px; }
        .all-btn:hover { background: var(--secondary); }

        /* شاشة الامتحان */
        #quiz-screen { display: none; }
        .progress-bar { width: 100%; background: #e2e8f0; border-radius: 10px; height: 12px; margin-bottom: 20px; overflow: hidden;}
        .progress-fill { background: var(--secondary); height: 100%; width: 0%; transition: 0.4s ease-out; }
        .stats { display: flex; justify-content: space-between; font-size: 15px; color: #475569; margin-bottom: 20px; font-weight: bold; border-bottom: 1px dashed #cbd5e1; padding-bottom: 10px;}
        #question-text { font-size: 22px; line-height: 1.6; margin-bottom: 25px; color: #1e293b; font-weight: 700; }
        
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        .option-btn { background: white; border: 2px solid #cbd5e1; padding: 16px 20px; border-radius: 12px; font-size: 17px; font-weight: 600; cursor: pointer; text-align: right; transition: 0.2s; display: flex; justify-content: space-between; align-items: center; color: #334155; }
        .option-btn:hover:not(:disabled) { border-color: var(--secondary); background: #f8fafc; }
        .option-btn:disabled { cursor: default; }
        
        /* التغذية الراجعة (التصحيح المباشر) */
        .option-btn.correct { background: var(--light-success); border-color: var(--success); color: var(--success); }
        .option-btn.wrong { background: var(--light-error); border-color: var(--error); color: var(--error); }
        .icon { font-size: 22px; }

        #next-btn { background: var(--primary); color: white; border: none; padding: 16px; border-radius: 12px; font-size: 18px; font-weight: bold; cursor: pointer; width: 100%; margin-top: 25px; transition: 0.3s; display: none; }
        #next-btn:hover { background: var(--secondary); transform: translateY(-2px); }
        
        /* شاشة النتيجة */
        #result-screen { display: none; text-align: center; }
        .score-circle { width: 160px; height: 160px; border-radius: 50%; border: 10px solid var(--primary); display: flex; align-items: center; justify-content: center; font-size: 40px; font-weight: 900; color: var(--primary); margin: 0 auto 25px; }
        .btn-restart { background: var(--secondary); color: white; border: none; padding: 15px 30px; border-radius: 10px; font-size: 18px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        .btn-restart:hover { background: var(--primary); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">

    </div>

        <button class="subject-btn all-btn" onclick="startQuiz('all')">اختبار شامل (تحدي جميع المواد)</button>
    </div>

    <!-- شاشة الامتحان -->
    <div id="quiz-screen">

        <div class="stats">

        <button class="btn-restart" onclick="location.reload()">العودة للقائمة الرئيسية 🏠</button>
    </div>
</div>

    let score = 0;

    // عناصر واجهة المستخدم
    const subjectScreen = document.getElementById('subject-selection');
    const quizScreen = document.getElementById('quiz-screen');
    const resultScreen = document.getElementById('result-screen');
    const questionText = document.getElementById('question-text');
    const optionsGrid = document.getElementById('options-grid');
    const nextBtn = document.getElementById('next-btn');
    const progressFill = document.getElementById('progress-fill');
    const questionCounter = document.getElementById('question-counter');
    const scoreCounter = document.getElementById('score-counter');

    // دالة لخلط المصفوفات (الأسئلة والخيارات)
    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
        return array;
    }

    // بدء الاختبار
    function startQuiz(subject) {
        if (subject === 'all') {
            currentQuestions = shuffleArray([...allQuestions]);
        } else {
            currentQuestions = shuffleArray(allQuestions.filter(q => q.subject === subject));
        }
        
        currentQuestionIndex = 0;
        score = 0;
        
        subjectScreen.style.display = 'none';
        quizScreen.style.display = 'block';
        
        loadQuestion();
    }

    // تحميل السؤال
    function loadQuestion() {
        nextBtn.style.display = 'none';
        optionsGrid.innerHTML = '';
        
        const currentQ = currentQuestions[currentQuestionIndex];
        questionText.innerText = currentQ.question;
        
        // تحديث العدادات وشريط التقدم
        questionCounter.innerText = `السؤال ${currentQuestionIndex + 1} من ${currentQuestions.length}`;
        scoreCounter.innerText = `النقاط: ${score}`;
        const progress = ((currentQuestionIndex) / currentQuestions.length) * 100;
        progressFill.style.width = `${progress}%`;

        // ترتيب الخيارات عشوائياً مع الاحتفاظ بالرقم الأصلي للجواب الصحيح
        let optionsWithIndex = currentQ.options.map((opt, index) => ({ text: opt, originalIndex: index }));
        optionsWithIndex = shuffleArray(optionsWithIndex);

        optionsWithIndex.forEach((optObj) => {
            const btn = document.createElement('button');
            btn.className = 'option-btn';
            btn.innerHTML = `<span>${optObj.text}</span> <span class="icon"></span>`;
            
            // إضافة حدث النقر
            btn.onclick = () => checkAnswer(btn, optObj.originalIndex, currentQ.answer, optionsWithIndex);
            optionsGrid.appendChild(btn);
        });
    }

    // التحقق من الجواب (هنا يكمن التحدي الذي طلبته)
    function checkAnswer(clickedBtn, selectedOriginalIndex, correctOriginalIndex, currentOptionsData) {
        const allBtns = optionsGrid.querySelectorAll('.option-btn');
        
        // بمجرد النقر، يتم تعطيل جميع الأزرار لمنع النقر المتعدد
        allBtns.forEach(b => b.disabled = true);

        if (selectedOriginalIndex === correctOriginalIndex) {
            // الجواب صحيح: تلوين الزر بالأخضر
            clickedBtn.classList.add('correct');
            clickedBtn.querySelector('.icon').innerText = '✔️';
            score++;
            scoreCounter.innerText = `النقاط: ${score}`;
        } else {
            // الجواب خاطئ: تلوين الزر الذي نقر عليه بالأحمر
            clickedBtn.classList.add('wrong');
            clickedBtn.querySelector('.icon').innerText = '❌';
            
            // في نفس اللحظة، البحث عن الجواب الصحيح وتلوينه بالأخضر لكي يتعلم الطالب
            allBtns.forEach((btn, idx) => {
                if (currentOptionsData[idx].originalIndex === correctOriginalIndex) {
                    btn.classList.add('correct');
                    btn.querySelector('.icon').innerText = '✔️';
                }
            });
        }
        
        // إظهار زر المرور للسؤال التالي
        nextBtn.style.display = 'block';
        if(currentQuestionIndex === currentQuestions.length - 1) {
            nextBtn.innerText = "عرض النتيجة النهائية 🏆";
        }
    }

    // المرور للسؤال الموالي
    function loadNextQuestion() {
        currentQuestionIndex++;
        if (currentQuestionIndex < currentQuestions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    // عرض النتيجة النهائية
    function showResults() {
        quizScreen.style.display = 'none';
        resultScreen.style.display = 'block';
        
        const percentage = Math.round((score / currentQuestions.length) * 100);
        const scoreCircle = document.getElementById('final-score');
        const feedbackMsg = document.getElementById('feedback-msg');
        
        scoreCircle.innerText = `${percentage}%`;
        
        if(percentage >= 80) {
            scoreCircle.style.borderColor = "var(--success)";
            scoreCircle.style.color = "var(--success)";
            feedbackMsg.innerHTML = `<strong>ممتاز جداً!</strong><br> أجبت بشكل صحيح على ${score} من أصل ${currentQuestions.length} أسئلة.<br>أنت مستعد تماماً لاجتياز الامتحان بنجاح.`;
        } else if(percentage >= 50) {
            scoreCircle.style.borderColor = "#eab308";
            scoreCircle.style.color = "#eab308";
            feedbackMsg.innerHTML = `<strong>مستوى لا بأس به.</strong><br> أجبت بشكل صحيح على ${score} من أصل ${currentQuestions.length} أسئلة.<br>تحتاج إلى مراجعة بعض المحاور لضمان التفوق.`;
        } else {
            scoreCircle.style.borderColor = "var(--error)";
            scoreCircle.style.color = "var(--error)";
            feedbackMsg.innerHTML = `<strong>انتبه!</strong><br> أجبت بشكل صحيح على ${score} من أصل ${currentQuestions.length} أسئلة فقط.<br>يجب عليك العودة للمحاضرات ومراجعة الدروس بتركيز أكبر.`;
        }
    }
</script>

</body>
</html>
